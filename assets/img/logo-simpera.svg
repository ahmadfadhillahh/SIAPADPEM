<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelBg" x1="320" y1="130" x2="1120" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F4FF"/>
      <stop offset="1" stop-color="#FFF9E8"/>
    </linearGradient>
    <filter id="cardShadow" x="240" y="90" width="920" height="580" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#cardShadow)">
    <rect x="320" y="130" width="820" height="480" rx="28" fill="url(#panelBg)"/>
  </g>

  <image href="logo-karimun.svg" x="30" y="100" width="470" height="520" preserveAspectRatio="xMidYMid meet"/>

  <text x="520" y="290" fill="#FF8C42" font-family="Inter, Arial, sans-serif" font-size="102" font-weight="800">SIMPERA</text>
  <text x="522" y="335" fill="#F7B25B" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="10">SISTEM INFORMASI</text>

  <text x="520" y="395" fill="#3B3D45" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">PENGENDALIAN</text>
  <text x="520" y="455" fill="#3B3D45" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">EVALUASI DAN</text>
  <text x="520" y="515" fill="#3B3D45" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">PELAPORAN PROGRAM</text>
  <text x="520" y="575" fill="#3B3D45" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">PEMBANGUNAN DAERAH</text>
</svg>
